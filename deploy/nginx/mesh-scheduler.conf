# Single-origin reverse proxy: serves the built frontend as static files
# AND proxies the backend API on the same host:port. This means the
# frontend's VITE_API_BASE_URL should be the empty string / same-origin
# (see build_for_pi.sh note), and the backend's session cookie is a
# same-origin cookie — no CORS, no cross-site cookie SameSite complications.
# That's the whole reason to put nginx in front rather than exposing the
# backend's :8000 directly next to a separately-served frontend port.
#
# Install: copy to /etc/nginx/sites-available/mesh-scheduler.conf, symlink
# into sites-enabled, `nginx -t`, `systemctl reload nginx`. See
# scripts/deploy_to_pi.sh which does this for you.

server {
    listen 80;
    server_name _;

    root /opt/mesh-scheduler/frontend;
    index index.html;

    # Static frontend — client-side view routing (login/otp/calendar) all
    # lives under one index.html, no server-side routes to match.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API — proxied on the SAME origin. Add new backend route
    # prefixes here if app/main.py ever grows one (currently: auth, events,
    # health).
    location ~ ^/(auth|events|health)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Session cookies must reach the backend and its Set-Cookie must
        # reach the browser unmodified — no proxy_cookie_* rewriting needed
        # since this is same-origin, same-path passthrough.
    }
}
