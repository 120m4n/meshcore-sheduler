[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mesh-scheduler-backend"
version = "0.1.0"
description = "Backend for the Mesh Event Scheduler (auth/OTP, calendar API, scheduler, mesh gateway)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "meshcore >= 2.3.9",
  "fastapi >= 0.115",
  "uvicorn[standard] >= 0.30",
  "sqlalchemy >= 2.0",
  "alembic >= 1.13",
  "pydantic-settings >= 2.4",
  "apscheduler >= 3.10",
  "bcrypt >= 4.1",
  "itsdangerous >= 2.2",
  "python-multipart >= 0.0.9",
  "pyserial >= 3.5",
]

[project.optional-dependencies]
dev = [
  "pytest >= 8.0",
  "pytest-asyncio >= 0.24",
  "httpx >= 0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
